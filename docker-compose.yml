services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      UPLOAD_DIR: data/uploads
      CHROMA_DIR: data/chroma
      # Origins allowed to call the API from a browser.
      CORS_ORIGINS: http://localhost:3000
    volumes:
      # Uploaded PDFs and the Chroma index survive container rebuilds.
      - backend-data:/app/data
      - hf-cache:/app/.cache/huggingface

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the client bundle — this is the URL the *browser* uses,
        # so it's localhost, not the compose service name.
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
  hf-cache:
